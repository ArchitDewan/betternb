name: betternb

services:
  postgres:
    image: postgres:16-alpine
    container_name: betternb-postgres
    environment:
      POSTGRES_USER: betternb
      POSTGRES_PASSWORD: betternb
      POSTGRES_DB: betternb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - betternb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betternb -d betternb"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  betternb-postgres:
